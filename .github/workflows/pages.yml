# main への push（または手動実行）で Hugo サイトをビルドし、GitHub Pages に公開する
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開中のデプロイは途中で止めず、最新の実行だけを待たせる
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Docsy v0.11.0 は Hugo 0.110〜0.145 対応。ローカルと同じ版に固定する
      HUGO_VERSION: 0.123.7
      HUGO_ENVIRONMENT: production
      HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
      TZ: Asia/Tokyo
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - uses: actions/checkout@v7

      # Hugo Modules（Docsy・Bootstrap・Font Awesome）の取得に Go が必要
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # 本番ビルドの PostCSS（autoprefixer）に Node が必要
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Hugo modules
        uses: actions/cache@v6
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: hugo-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: hugo-${{ runner.os }}-

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
